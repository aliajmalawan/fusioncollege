; PHP settings for the live server (cPanel reads this file from public_html).
; Phone photos are often 5-15 MB; every uploaded photo is resized and compressed
; by the website, so these limits only decide what can be uploaded, not what is stored.
upload_max_filesize = 20M
post_max_size = 128M
max_file_uploads = 30
memory_limit = 256M
max_execution_time = 120

; Pages are sent gzip-compressed (a page's HTML shrinks to about a fifth). If the server already
; compresses them, it leaves pages that are compressed here alone, so nothing is done twice.
zlib.output_compression = On
